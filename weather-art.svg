    <text x="40" y="174" fill="#858092" font-family="Arial,sans-serif" font-size="16">Sunny skies</text>
    <path d="M32 214h476" stroke="#eee9e3"/>
    <g font-family="Arial,sans-serif" text-anchor="middle">
      <text x="83" y="248" fill="#858092" font-size="13">MON</text><text x="177" y="248" fill="#858092" font-size="13">TUE</text><text x="271" y="248" fill="#858092" font-size="13">WED</text><text x="365" y="248" fill="#858092" font-size="13">THU</text><text x="459" y="248" fill="#858092" font-size="13">FRI</text>
      <circle cx="83" cy="293" r="15" fill="#ffcb70"/><path d="M177 280c-9 0-15 7-15 15s6 15 15 15h18a13 13 0 0 0 1-26 17 17 0 0 0-19-4z" fill="#8be1c0"/><circle cx="271" cy="293" r="15" fill="#ffcb70"/><path d="M365 280c-9 0-15 7-15 15s6 15 15 15h18a13 13 0 0 0 1-26 17 17 0 0 0-19-4z" fill="#8be1c0"/><circle cx="459" cy="293" r="15" fill="#ffcb70"/>
