<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Weather forecast project illustration</title>
  <desc id="desc">A sunny forecast card with a sun and a row of forecast days.</desc>
  <rect width="900" height="500" fill="#e2f4ed"/>
  <circle cx="127" cy="374" r="100" fill="#8be1c0" opacity=".5"/><circle cx="790" cy="111" r="76" fill="#ff705e" opacity=".18"/>
  <path d="M0 406c151-67 277-32 388 4s216 41 316-9 155-63 196-42v141H0z" fill="#c9eadb"/>
  <g transform="translate(180 62)">
    <rect width="540" height="377" rx="25" fill="#fffdf8"/>
    <text x="38" y="47" fill="#211a3b" font-family="Arial,sans-serif" font-size="19" font-weight="700">TODAY'S FORECAST</text>
    <text x="38" y="76" fill="#858092" font-family="Arial,sans-serif" font-size="14">A quick look at the week ahead</text>
    <circle cx="425" cy="126" r="49" fill="#ffcb70"/>
    <g stroke="#ffcb70" stroke-width="7" stroke-linecap="round"><path d="M425 57v-15M425 210v-15M356 126h-15M509 126h-15M376 77l-11-11M486 185l-11-11M474 77l11-11M365 185l11-11"/></g>
